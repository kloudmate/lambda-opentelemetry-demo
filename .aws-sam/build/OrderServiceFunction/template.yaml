AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda OpenTelemetry Demo - Order, Inventory, and Payment Services

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs18.x
    Environment:
      Variables:
        ENVIRONMENT: production
        OTEL_EXPORTER_OTLP_ENDPOINT: !Ref OtelCollectorEndpoint

Parameters:
  OtelCollectorEndpoint:
    Type: String
    Default: 'http://localhost:4318/v1/traces'
    Description: OpenTelemetry Collector endpoint URL

Resources:
  # Order Service Function
  OrderServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: nodejs18.x
    Properties:
      FunctionName: order-service
      CodeUri: ./
      Handler: src/order-service/index.handler
      Description: Order Service - Orchestrates order processing
      Environment:
        Variables:
          INVENTORY_SERVICE_URL: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/inventory'
          PAYMENT_SERVICE_URL: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/payment'
      Events:
        OrderApi:
          Type: Api
          Properties:
            Path: /order
            Method: post
            RestApiId: !Ref ServerlessRestApi

  # Inventory Service Function
  InventoryServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: nodejs18.x
    Properties:
      FunctionName: inventory-service
      CodeUri: ./
      Handler: src/inventory-service/index.handler
      Description: Inventory Service - Checks item availability
      Events:
        InventoryApi:
          Type: Api
          Properties:
            Path: /inventory
            Method: post
            RestApiId: !Ref ServerlessRestApi

  # Payment Service Function
  PaymentServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: nodejs18.x
    Properties:
      FunctionName: payment-service
      CodeUri: ./
      Handler: src/payment-service/index.handler
      Description: Payment Service - Processes payments
      Events:
        PaymentApi:
          Type: Api
          Properties:
            Path: /payment
            Method: post
            RestApiId: !Ref ServerlessRestApi

  # API Gateway
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Description: API Gateway for Lambda OpenTelemetry Demo

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  
  OrderServiceUrl:
    Description: Order Service endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/order'
    
  InventoryServiceUrl:
    Description: Inventory Service endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/inventory'
    
  PaymentServiceUrl:
    Description: Payment Service endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/payment'
