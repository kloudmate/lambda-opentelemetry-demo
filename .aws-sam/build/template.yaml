AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda OpenTelemetry Demo - Order, Inventory, and Payment Services with
  ADOT Layer
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-handler
        OTEL_SERVICE_NAME: will-be-overridden
        OTEL_TRACES_SAMPLER: AlwaysOn
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT:
          Ref: OtelCollectorEndpoint
        OTEL_PROPAGATORS: tracecontext
        OTEL_RESOURCE_ATTRIBUTES:
          Fn::Sub: deployment.environment=${Environment}
Parameters:
  OtelCollectorEndpoint:
    Type: String
    Default: http://localhost:4318
    Description: OpenTelemetry Collector endpoint URL (without /v1/traces path)
  Environment:
    Type: String
    Default: production
    Description: Deployment environment (e.g., development, staging, production)
  AdotLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-nodejs-amd64-ver-1-18-1:5
    Description: 'ARN of the AWS Distro for OpenTelemetry (ADOT) Lambda Layer for
      Node.js.

      Find the latest ARN for your region at:

      https://aws-otel.github.io/docs/getting-started/lambda/lambda-js

      '
Resources:
  OrderServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: nodejs20.x
      SamResourceId: OrderServiceFunction
    Properties:
      FunctionName: order-service
      CodeUri: OrderServiceFunction
      Handler: src/order-service/index.handler
      Description: Order Service - Orchestrates order processing
      Layers:
      - Ref: AdotLayerArn
      Environment:
        Variables:
          OTEL_SERVICE_NAME: order-service
          INVENTORY_SERVICE_URL:
            Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/inventory
          PAYMENT_SERVICE_URL:
            Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/payment
      Events:
        OrderApi:
          Type: Api
          Properties:
            Path: /order
            Method: post
            RestApiId:
              Ref: ApiGateway
  InventoryServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: nodejs20.x
      SamResourceId: InventoryServiceFunction
    Properties:
      FunctionName: inventory-service
      CodeUri: InventoryServiceFunction
      Handler: src/inventory-service/index.handler
      Description: Inventory Service - Checks item availability
      Layers:
      - Ref: AdotLayerArn
      Environment:
        Variables:
          OTEL_SERVICE_NAME: inventory-service
      Events:
        InventoryApi:
          Type: Api
          Properties:
            Path: /inventory
            Method: post
            RestApiId:
              Ref: ApiGateway
  PaymentServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: nodejs20.x
      SamResourceId: PaymentServiceFunction
    Properties:
      FunctionName: payment-service
      CodeUri: PaymentServiceFunction
      Handler: src/payment-service/index.handler
      Description: Payment Service - Processes payments
      Layers:
      - Ref: AdotLayerArn
      Environment:
        Variables:
          OTEL_SERVICE_NAME: payment-service
      Events:
        PaymentApi:
          Type: Api
          Properties:
            Path: /payment
            Method: post
            RestApiId:
              Ref: ApiGateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Description: API Gateway for Lambda OpenTelemetry Demo
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod
  OrderServiceUrl:
    Description: Order Service endpoint
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/order
  InventoryServiceUrl:
    Description: Inventory Service endpoint
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/inventory
  PaymentServiceUrl:
    Description: Payment Service endpoint
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/payment
  AdotLayerVersion:
    Description: ADOT Lambda Layer ARN being used
    Value:
      Ref: AdotLayerArn
